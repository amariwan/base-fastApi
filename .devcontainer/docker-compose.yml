services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    command: sleep infinity
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - vscode-server:/home/developer/.vscode-server
      - uv-cache:/home/developer/.cache/uv
    ports:
      - '127.0.0.1:${APP_PORT:-5000}:5000'
    environment:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      LOG_LEVEL: INFO
      UV_PROJECT_ENVIRONMENT: /home/developer/.venvs/service
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/service_db
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: service_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  vscode-server:
  uv-cache:
  postgres-data:
