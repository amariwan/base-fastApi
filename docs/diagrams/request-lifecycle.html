<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>base-fastApi request lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#bf4520;--link:#2e5aa8}body{min-height:100vh;padding:3rem 2rem;background:var(--paper);color:var(--ink);font-family:'Geist',system-ui,sans-serif;display:flex;align-items:center;justify-content:center}.frame{width:100%;max-width:1280px}.eyebrow{margin-bottom:.5rem;color:var(--muted);font:500 .66rem 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase}h1{margin-bottom:.4rem;font:400 clamp(1.7rem,2.8vw,2.4rem)/1.1 'Instrument Serif',serif;letter-spacing:-.02em}.lede{margin-bottom:1.4rem;color:var(--muted);font-size:.92rem}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:1280px;display:block}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}
  </style>
</head>
<body><main class="frame"><p class="eyebrow">Sequence · balanced · engineer audience</p><h1>One request. Clear ownership at every boundary.</h1><p class="lede">Authentication, transport mapping, business decisions, and infrastructure calls remain distinct from arrival to response.</p><div class="diagram-container">
  <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="request-lifecycle-title request-lifecycle-desc">
    <title id="request-lifecycle-title">base-fastApi request lifecycle</title>
    <desc id="request-lifecycle-desc">Sequence showing an HTTP request moving through middleware, a service API, application and domain logic, and an infrastructure adapter before returning a unified response.</desc>
    <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs>
    <rect width="1280" height="720" fill="#f5f5f5"/>
    <!-- lifelines -->
    <g stroke="rgba(45,49,66,.22)" stroke-width="1" stroke-dasharray="3,3"><line x1="136" y1="140" x2="136" y2="600"/><line x1="384" y1="140" x2="384" y2="600"/><line x1="632" y1="140" x2="632" y2="600"/><line x1="880" y1="140" x2="880" y2="600"/><line x1="1128" y1="140" x2="1128" y2="600"/></g>
    <!-- activation bars -->
    <rect x="380" y="184" width="8" height="368" fill="rgba(45,49,66,.06)" stroke="#4f5d75" stroke-width=".8"/><rect x="628" y="240" width="8" height="256" fill="rgba(45,49,66,.06)" stroke="#4f5d75" stroke-width=".8"/><rect x="876" y="296" width="8" height="144" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width=".8"/><rect x="1124" y="352" width="8" height="40" fill="rgba(45,49,66,.06)" stroke="#4f5d75" stroke-width=".8"/>
    <!-- messages -->
    <line x1="136" y1="184" x2="380" y2="184" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <line x1="388" y1="240" x2="628" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="636" y1="296" x2="876" y2="296" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="884" y1="352" x2="1124" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="1124" y1="392" x2="884" y2="392" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <line x1="876" y1="440" x2="636" y2="440" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <line x1="628" y1="496" x2="388" y2="496" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <line x1="380" y1="552" x2="136" y2="552" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- message labels with visible gap -->
    <g font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle"><rect x="212" y="156" width="92" height="12" rx="2" fill="#f5f5f5"/><text x="258" y="165" fill="#2e5aa8">HTTP REQUEST</text><rect x="448" y="212" width="116" height="12" rx="2" fill="#f5f5f5"/><text x="506" y="221" fill="#4f5d75">CLAIMS + REQUEST ID</text><rect x="700" y="268" width="112" height="12" rx="2" fill="#f5f5f5"/><text x="756" y="277" fill="#bf4520">INVOKE USE CASE</text><rect x="956" y="324" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="1004" y="333" fill="#4f5d75">CALL PORT</text><rect x="956" y="404" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="1004" y="413" fill="#4f5d75">TYPED RESULT</text><rect x="700" y="452" width="112" height="12" rx="2" fill="#f5f5f5"/><text x="756" y="461" fill="#4f5d75">DOMAIN OUTCOME</text><rect x="456" y="508" width="100" height="12" rx="2" fill="#f5f5f5"/><text x="506" y="517" fill="#4f5d75">MAP RESPONSE</text><rect x="212" y="524" width="92" height="12" rx="2" fill="#f5f5f5"/><text x="258" y="533" fill="#bf4520">HTTP RESPONSE</text></g>
    <!-- actor boxes -->
    <g font-family="'Geist',sans-serif" text-anchor="middle"><rect x="64" y="76" width="144" height="64" rx="6" fill="rgba(79,93,117,.10)" stroke="#5a6580"/><text x="136" y="108" fill="#2d3142" font-size="12" font-weight="600">Client</text><text x="136" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">HTTP caller</text><rect x="296" y="76" width="176" height="64" rx="6" fill="#fff" stroke="#2d3142"/><text x="384" y="108" fill="#2d3142" font-size="12" font-weight="600">HTTP boundary</text><text x="384" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">middleware · auth</text><rect x="552" y="76" width="160" height="64" rx="6" fill="#fff" stroke="#2d3142"/><text x="632" y="108" fill="#2d3142" font-size="12" font-weight="600">Service API</text><text x="632" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">transport adapter</text><rect x="788" y="76" width="184" height="64" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520"/><text x="880" y="108" fill="#2d3142" font-size="12" font-weight="600">Application + Domain</text><text x="880" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">policy · invariants</text><rect x="1040" y="76" width="176" height="64" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/><text x="1128" y="108" fill="#2d3142" font-size="12" font-weight="600">Infrastructure</text><text x="1128" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">DB · storage · APIs</text></g>
    <!-- legend -->
    <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(45,49,66,.12)"/><text x="40" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">LEGEND</text><line x1="140" y1="660" x2="172" y2="660" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/><text x="184" y="664" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif">External call</text><line x1="316" y1="660" x2="348" y2="660" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="360" y="664" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif">Return</text><line x1="452" y1="660" x2="484" y2="660" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/><text x="496" y="664" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif">Business path</text>
  </svg>
</div></main></body></html>
