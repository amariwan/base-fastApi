<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>base-fastApi AI safety layers</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#bf4520}body{min-height:100vh;padding:3rem 2rem;background:var(--paper);color:var(--ink);font-family:'Geist',system-ui,sans-serif;display:flex;align-items:center;justify-content:center}.frame{width:100%;max-width:1280px}.eyebrow{margin-bottom:.5rem;color:var(--muted);font:500 .66rem 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase}h1{margin-bottom:.4rem;font:400 clamp(1.7rem,2.8vw,2.4rem)/1.1 'Instrument Serif',serif;letter-spacing:-.02em}.lede{margin-bottom:1.4rem;color:var(--muted);font-size:.92rem}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:1280px;display:block}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}
  </style>
</head>
<body><main class="frame"><p class="eyebrow">Layer stack · governance control catalog · mixed audience</p><h1>AI is powerful only after the boundaries are explicit.</h1><p class="lede">Five enforcement surfaces keep provider access, tool execution, data movement, and observability under application control.</p><div class="diagram-container">
  <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-safety-layers-title ai-safety-layers-desc">
    <title id="ai-safety-layers-title">base-fastApi AI safety layers</title>
    <desc id="ai-safety-layers-desc">Layered control catalog showing business ownership, bounded agent execution, policy enforcement, model routing, and provider adapters in the optional Core AI platform.</desc>
    <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs>
    <rect width="1280" height="720" fill="#f5f5f5"/>
    <!-- direction -->
    <text x="64" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".16em">BUSINESS</text><line x1="92" y1="132" x2="92" y2="548" stroke="rgba(45,49,66,.3)"/><polygon points="88,132 96,132 92,124" fill="#4f5d75"/><text x="64" y="572" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".16em">PROVIDER</text>
    <!-- stack -->
    <rect x="140" y="108" width="1020" height="88" fill="#fff" stroke="rgba(45,49,66,.12)"/><text x="164" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">L5 · OWN</text><text x="304" y="148" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',sans-serif">Business service ports</text><text x="1128" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="end">service code · request time</text><text x="1128" y="164" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif" text-anchor="end">Product permissions and domain rules stay outside Core AI</text>
    <rect x="140" y="196" width="1020" height="88" fill="#ececec" stroke="rgba(45,49,66,.12)"/><text x="164" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">L4 · RUN</text><text x="304" y="236" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',sans-serif">Agent and workflow runtime</text><text x="1128" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="end">code · run time</text><text x="1128" y="252" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif" text-anchor="end">Bounded steps, cancellation, idempotency, explicit approvals</text>
    <rect x="140" y="284" width="1020" height="88" fill="rgba(191,69,32,.08)" stroke="#bf4520"/><text x="164" y="320" fill="#bf4520" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">L3 · GUARD</text><text x="304" y="324" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',sans-serif">Policy enforcement</text><text x="1128" y="316" fill="#bf4520" font-size="9" font-family="'Geist Mono',monospace" text-anchor="end">code + platform · every call</text><text x="1128" y="340" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif" text-anchor="end">Provider allowlists, tool permissions, endpoint policy, limits</text>
    <rect x="140" y="372" width="1020" height="88" fill="#f5f5f5" stroke="rgba(45,49,66,.12)"/><text x="164" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">L2 · ROUTE</text><text x="304" y="412" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',sans-serif">Model and tool routing</text><text x="1128" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="end">code · request time</text><text x="1128" y="428" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif" text-anchor="end">Declared capabilities, no guessed fallback, tenant-aware retrieval</text>
    <rect x="140" y="460" width="1020" height="88" fill="#ececec" stroke="rgba(45,49,66,.12)"/><text x="164" y="496" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">L1 · CONNECT</text><text x="304" y="500" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',sans-serif">Provider adapters</text><text x="1128" y="492" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="end">lazy composition · call time</text><text x="1128" y="516" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif" text-anchor="end">Local Ollama, compatible endpoints, opt-in cloud providers</text>
    <!-- residual and default policy callouts -->
    <rect x="140" y="588" width="492" height="72" rx="6" fill="#fff" stroke="rgba(45,49,66,.12)"/><text x="164" y="616" fill="#bf4520" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">DEFAULT POSTURE</text><text x="164" y="640" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">AI, cloud transfer, fallback, and persistence are off.</text>
    <rect x="668" y="588" width="492" height="72" rx="6" fill="#fff" stroke="rgba(45,49,66,.12)"/><text x="692" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">OBSERVABILITY</text><text x="692" y="640" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Operational signals exclude prompts, outputs, and secrets.</text>
  </svg>
</div></main></body></html>
