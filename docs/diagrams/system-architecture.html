<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>base-fastApi system architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#5a6580; --accent:#bf4520; --link:#2e5aa8; }
    body { min-height:100vh; padding:3rem 2rem; background:var(--paper); color:var(--ink); font-family:'Geist',system-ui,sans-serif; display:flex; align-items:center; justify-content:center; }
    .frame { width:100%; max-width:1280px; }
    .eyebrow { margin-bottom:.5rem; color:var(--muted); font:500 .66rem 'Geist Mono',monospace; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin-bottom:.4rem; font:400 clamp(1.7rem,2.8vw,2.4rem)/1.1 'Instrument Serif',serif; letter-spacing:-.02em; }
    .lede { margin-bottom:1.4rem; color:var(--muted); font-size:.92rem; }
    .diagram-container { width:100%; overflow-x:auto; }
    svg { width:100%; min-width:1280px; display:block; }
    @media print { .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · balanced · mixed audience</p>
    <h1>Build the product on services, not framework plumbing.</h1>
    <p class="lede">A modular FastAPI application where business capabilities stay isolated and the technical platform remains reusable.</p>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-architecture-title system-architecture-desc">

        <desc id="system-architecture-desc">Architecture overview showing requests entering the FastAPI boundary, moving through feature-owned service layers, and reaching reusable core capabilities and external systems.</desc>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- zones -->
        <rect x="40" y="64" width="280" height="528" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>

        <rect x="352" y="64" width="520" height="528" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>

        <text x="436" y="80" fill="#5a6580" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".14em">FEATURE SERVICE</text>
        <rect x="904" y="64" width="336" height="528" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
        <rect x="916" y="68" width="132" height="16" rx="2" fill="#f5f5f5"/>
        <text x="982" y="80" fill="#5a6580" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".14em">PLATFORM</text>

        <path d="M 808 508 H 856 Q 864 508 864 516 V 540 Q 864 548 872 548 H 944" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- nodes -->
        <rect x="80" y="188" width="200" height="64" rx="6" fill="#f5f5f5"/><rect x="80" y="188" width="200" height="64" rx="6" fill="rgba(79,93,117,.10)" stroke="#5a6580"/>
        <rect x="92" y="196" width="36" height="12" rx="2" fill="none" stroke="rgba(90,101,128,.5)"/><text x="110" y="205" fill="#5a6580" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">EXT</text>
        <text x="180" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Clients &amp; integrations</text><text x="180" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">HTTP · WebSocket</text>
        <rect x="60" y="332" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="60" y="332" width="240" height="64" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520"/>

        <text x="180" y="366" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">FastAPI boundary</text><text x="180" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">auth · limits · errors</text>
        <rect x="412" y="332" width="200" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
        <rect x="424" y="340" width="32" height="12" rx="2" fill="none" stroke="rgba(45,49,66,.4)"/><text x="440" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">API</text>
        <text x="512" y="366" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Service API</text><text x="512" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">transport mapping</text>
        <rect x="412" y="456" width="200" height="64" rx="6" fill="#f5f5f5"/><rect x="412" y="456" width="200" height="64" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520"/>
        <rect x="424" y="464" width="36" height="12" rx="2" fill="none" stroke="rgba(191,69,32,.5)"/><text x="442" y="473" fill="#bf4520" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">APP</text>
        <text x="512" y="490" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Application + Domain</text><text x="512" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">use cases · invariants</text>
        <rect x="708" y="456" width="100" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
        <text x="758" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Adapters</text><text x="758" y="504" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">infra</text>
        <rect x="944" y="180" width="256" height="160" rx="6" fill="#f5f5f5"/><rect x="944" y="180" width="256" height="160" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
        <rect x="956" y="192" width="44" height="12" rx="2" fill="none" stroke="rgba(79,93,117,.5)"/><text x="978" y="201" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">CORE</text>
        <text x="1072" y="224" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Reusable platform</text>
        <text x="1072" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">AUTH · DB · STORAGE</text><text x="1072" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">CACHE · EMAIL · CHANNELS</text><text x="1072" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">HEALTH · LOGGING · AI</text>
        <rect x="944" y="500" width="256" height="96" rx="6" fill="#f5f5f5"/><rect x="944" y="500" width="256" height="96" rx="6" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.3)"/>
        <text x="1072" y="544" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">External systems</text><text x="1072" y="568" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">DB · S3 · Redis · SMTP · models</text>

        <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(45,49,66,.12)"/>

        <rect x="140" y="652" width="16" height="12" rx="2" fill="rgba(191,69,32,.08)" stroke="#bf4520"/><text x="166" y="662" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif">Primary path</text>
        <rect x="300" y="652" width="16" height="12" rx="2" fill="#fff" stroke="#2d3142"/><text x="326" y="662" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif">Service-owned</text>
        <rect x="476" y="652" width="16" height="12" rx="2" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/><text x="502" y="662" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif">Reusable Core</text>

  </main>
</body>
</html>
