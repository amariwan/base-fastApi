[project]
name = "base-fastapi-core"
version = "0.1.0"
description = "Reusable FastAPI infrastructure components"
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["pydantic-settings>=2.13,<3"]

[project.optional-dependencies]
redis = ["redis>=6.4"]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.3,<2", "ruff>=0.15", "mypy>=1.10"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
